- name: Nirav Pravinbhai Bhatt
  role: Head of lab; Associate Professor
  group: current
  photo: assets/img/people/nirav.webp
  bio: >-
    Nirav Bhatt has a BE in Chemical Engineering from The M. S. University of Baroda, an MTech from IIT Madras, and a DSc from EPFL, Switzerland.
    He is an Associate Professor at the Wadhwani School of Data Science and AI (WSAI) and the Department of Biotechnology, IIT Madras, and Program Chair of the MTech in Data Science and AI at the IIT Madras Zanzibar campus.
    He is affiliated with RBCDSAI and IBSE at IIT Madras. His research covers modelling and identification of biological and chemical systems, bioprocess control, and machine learning for engineering systems.
