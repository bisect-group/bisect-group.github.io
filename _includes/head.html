<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- assign page_title = page.title | default: site.title -%}
<title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page_title }} | {{ site.title }}{% endif %}</title>
{%- assign page_desc = page.description | default: site.description | strip_newlines | strip -%}
<meta name="description" content="{{ page_desc | escape }}">
<meta property="og:title" content="{{ page_title | escape }}">
<meta property="og:description" content="{{ page_desc | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/img/logos/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/assets/img/logos/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/assets/img/logos/apple-touch-icon.png' | relative_url }}">
<script>
  const t = localStorage.getItem("lc-theme");
  if (t) document.documentElement.dataset.theme = t;
</script>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
